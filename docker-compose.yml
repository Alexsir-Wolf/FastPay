services:
  postgres_db:
    image: postgres:latest
    container_name: fastpay_postgres
    restart: always
    environment:
      - POSTGRES_USER=fastpay
      - POSTGRES_PASSWORD=fastpay
      - POSTGRES_DB=fastpay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastpay"]
      interval: 5s
      timeout: 5s
      retries: 20

  fastpay_api:
    build:
      context: .
      dockerfile: FastPay.Api/Dockerfile
    container_name: fastpay_api
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Settings__PostgresSettings__ConnectionString=Host=postgres_db;Port=5432;Database=fastpay_db;Username=fastpay;Password=fastpay
    ports:
      - "5030:5030"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5030/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: fastpay_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - fastpay_api

  grafana:
    image: grafana/grafana:latest
    container_name: fastpay_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
