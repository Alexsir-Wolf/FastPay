version: '3.8'

services:
  postgres_db:
    image: postgres:latest
    container_name: fastpay_postgres
    restart: always
    environment:
      - POSTGRES_USER=fastpay
      - POSTGRES_PASSWORD=fastpay
      - POSTGRES_DB=fastpay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
